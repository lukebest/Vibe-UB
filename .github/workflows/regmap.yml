name: regmap

on:
  push:
  pull_request:

jobs:
  regmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pyyaml pytest "git+https://github.com/lukebest/pyCircuit@43cc5918e3d09ecc0c814cabef6c1384cb9980ae"
      - name: Validate YAML
        run: python3 scripts/gen_regmap.py --validate-only
      - name: Pytest
        run: pytest -q scripts/tests
      - name: Check generated outputs
        run: python3 scripts/gen_regmap.py --check
      - name: Elaborate CSR (TEST_HOOKS=0/1, all variants)
        run: |
          python3 -c "
          import runpy
          ns=runpy.run_path('pycircuit/csr/ub_csr_regs.py')
          assert ns['VARIANTS'], 'variants table empty'
          for tag in ns['VARIANTS']:
              s0=ns['elaborate'](0, variant=tag)
              s1=ns['elaborate'](1, variant=tag)
              print(s0); print(s1)
              assert s0['elaborated'] and s1['elaborated'], (tag, s0, s1)
              assert ns['csr_module_name'](tag) in s0['modules']
          "
      - name: Verilator lint CSR (pycc .v when backend present)
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          python3 scripts/lint_csr.sh
          # lint_csr.sh SKIP-exits 0 when pycc is absent (GH runner has no LLVM 19).

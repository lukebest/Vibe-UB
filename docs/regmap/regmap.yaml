# Vibe-UB M1 register map — single source.
# Edit this file. Regenerated artifacts: docs/REGMAP.md and scripts/gen_regmap.py outputs.
# UB Base Spec is INTERNAL ONLY: cite section numbers only; do not copy spec body.

meta:
  title: Vibe-UB M1 寄存器表
  companion_spec: SPEC.md
  spec_baseline: UB Base Spec Rev 2.0，附录 D **子集**（见 [SPEC_INDEX.md](SPEC_INDEX.md)）
  bus:
    spec_ref: SPEC.md §3.2.3
    data_width_bits: 32
    addr_width_bits: 16
    alignment_bytes: 4
    full_word_writes_only: true
    wstrb: false
    read_latency_cycles: 1
    write_latency_cycles: 1
    write_rvalid: 0
    write_err_valid: true
    unmapped:
      read_data: 0
      read_csr_err: 1
      write: ignore
      write_csr_err: 1
  byte_order: 小端；位 0 为 LSB
  machine_readable_columns:
    - offset_hex
    - reg_name
    - field_name
    - hi
    - lo
    - access
    - reset_hex
    - description
    - spec_ref
  access_types: [RW, RO, W1C, WO, MIX]
  citation_note: >-
    不抄录规范字段说明、表或复位表。App. D / Init Block 只给 **节号**。
    实现对照官方规范展开位域。本表足够生成头文件与 Python 寄存器模型。
  column_notes:
    offset_hex: 相对 M1 CSR 窗口的字节偏移。
    access: "`RW` / `RO` / `W1C` / `WO`。禁止读清；禁止 RW 写清。粘滞=W1C；计数=RO + `CNT_CLR`。"
    reset_hex: 字段复位。`NA` = 本仓库不抄规范复位。`variant` = 由 `variants:` 表按 tag 填入，禁止手写。
    spec_ref: 规范节号，或 `proj`（项目本地）。
  test_window_rule: >-
    测试寄存器仅当 `tb_test_mode=1` 且 `TEST_HOOKS=1` 时功能生效。
    `tb_test_mode=0` 或 PRODUCT：该窗读 0、写忽略、`csr_err=0`（已映射）。
    见 SPEC §3.2.3、§11。
  team_process_note: 职责与流程见 [TEAM.md](TEAM.md)、[PROCESS.md](PROCESS.md)。

global_rules:
  full_word_writes_only: true
  read_latency_cycles: 1
  write_rvalid_next_cycle: 0
  write_err_valid_next_cycle: true
  unmapped_csr_err: true
  no_read_clear: true
  no_rw_write_clear: true
  sticky_access: W1C
  counter_access: RO + CNT_CLR
  reserved_bits: 未实现的保留位读 0、写忽略。
  notes:
    - 无 `csr_wstrb`；仅 32-bit 整字写。
    - 16-bit 字节地址，4 字节对齐；未对齐按未映射处理。
    - 读固定 1 拍：请求的下一拍 `csr_rvalid`/`csr_rdata`/`csr_err`。
    - 写响应：下一拍 `csr_rvalid=0`，`csr_err` 有效（SPEC §3.2.3）。
    - 未映射：读回 0 且 `csr_err=1`；写忽略且 `csr_err=1`。
    - 计数器饱和到全 1。无读清、无 RW 写清。
    - "`PORT_RST` 写 1 自清，产生 16 拍 `core_clk` 脉冲；不复位 CSR 配置、计数、IRQ、TEST。"
    - TEST 窗在 `tb_test_mode=0` 或 `TEST_HOOKS=0` 时已映射：读 0、写忽略、`csr_err=0`。
    - irq = IRQ_EN & OR(IRQ_STATUS & ~IRQ_MASK)；MASK 位 1=屏蔽；复位全部屏蔽。

variants:
  default: product_x4_vl2
  product_x4_vl2:
    NUM_LANES: 4
    NUM_VL: 2
    SCR_PLACEHOLDER: 1
  product_x8_vl2:
    NUM_LANES: 8
    NUM_VL: 2
    SCR_PLACEHOLDER: 1

irq:
  enable: {reg: CTRL, field: IRQ_EN}
  status_reg: IRQ_STATUS
  mask: {reg: IRQ_MASK, field: MASK}
  output: irq
  polarity: high
  reset_masked: true
  note: >-
    REGMAP: IRQ_EN=1 and any unmasked IRQ_STATUS bit. MASK bit 1 = block.
    Reset IRQ_MASK=all-1, IRQ_EN=0. Port `irq` is active-high.

windows:
  - id: CTRL_STATUS
    name: CTRL/STATUS
    start: 0x0000
    end: 0x00FF
    contents: 端口复位、启动训练、链路/DLL 状态、irq
    section: "2.1 CTRL / STATUS（`0x0000`）"
  - id: PARAM
    name: PARAM
    start: 0x0100
    end: 0x01FF
    contents: M1 / spec-max 参数读回
    section: "2.2 PARAM 读回（`0x0100`）"
  - id: ERR
    name: ERR
    start: 0x0200
    end: 0x02FF
    contents: 错误计数 RO（饱和）+ `CNT_CLR`（WO）
    section: "2.3 ERR 计数（`0x0200`）"
  - id: TEST
    name: TEST
    start: 0x0300
    end: 0x03FF
    contents: 测试控制：代替 deposit 的缩放/关闭位
    section: "2.4 TEST（`0x0300`）— 代替内部 deposit"
    test_gated: true
    entire_range_mapped: true
    when_inactive:
      mapped: true
      read_data: 0
      write: ignore
      csr_err: 0
      note: >-
        TEST window when tb_test_mode=0 reads 0 / writes ignored / csr_err=0.
        PRODUCT (TEST_HOOKS=0) 相同。已映射，不是未映射。
    notes:
      - "功能生效：`TEST_HOOKS=1` **且** `tb_test_mode=1`。"
      - "`tb_test_mode=0` 以及 PRODUCT（`TEST_HOOKS=0`）：本窗地址 **已映射**。读回 0，写忽略，**`csr_err=0`**。"
      - "PRODUCT 与 HOOKS（`tb_test_mode=0`）对 eqy 等价（SPEC §11 (d)）。`PORT_RST` 不复位本窗。"
      - 复位 = 不介入。
  - id: APPD_PORT
    name: APPD_PORT
    start: 0x1000
    end: 0x1FFF
    contents: >-
      App. D 端口子集镜像。相对偏移与规范 PORT0（基址 `0x0002_0000`）对齐，便于日后并入完整配置空间
    section: "2.5 App. D 端口镜像（`0x1000`）"

unimplemented:
  - CFG0_BASIC 设备级
  - CFG1_*
  - CFG0_ROUTE_TABLE
  - 热插拔 / 眼图 / QDLWS / 多 DATA_RATE 切片（M1 固定 Data Rate 0）

reserved_policy: >-
  未实现的保留位读 0、写忽略。多值字段的保留编码（如 `RETRY_REQ_ST` 5–7、
  `RETRY_ACK_ST` 2–3、`NUM_LANES_*` 除 1/2/4/8 外）由 RTL **永不产出**；TB assert。

prose:
  irq: >-
    `irq`：高有效电平。`IRQ_EN=1` 且任一未屏蔽 `IRQ_STATUS` 位置位则为 1。
    复位后 `IRQ_MASK` 全 1、`IRQ_EN=0`，全部源屏蔽。
  param_intro: >-
    只读，反映编译/协商后的生效值。`NUM_LANES_*` / `NUM_VL` / `SCR_PLACEHOLDER`
    的复位来自 `variants:` 表（SPEC §2.2 一套参数一份 `ub_csr_<tag>` 网表），
    禁止在字段上手写。协商完成后 STATUS 类镜像以 App. D 节为准。
    `PARAM_VARIANT`（`0x011C`）是给单一驱动覆盖全部变体的能力字：
    `NUM_LANES` 复用 `PARAM_PHY.NUM_LANES_TX` / `NUM_LANES_RX`（不重复）；
    本寄存器含 `NUM_VL[3:0]` 与 `SCR_PLACEHOLDER[4]`（1=扰码叶子为 `_placeholder`，仅 lint/TB）。
  init_block: >-
    Init Block 其余字段（`DATA_ACK_GRAIN_SIZE`、`CTRL_ACK_GRAIN_SIZE`、
    `DATA_CREDIT_GRAIN_SIZE`、`CTRL_CREDIT_GRAIN_SIZE`、`PACKET_MIN_INTERVAL`）
    的位打包 **不在本仓库展开**，实现按 UB-DL §4.3.3.9；协商后的只读镜像落在
    App. D.6.2.3 窗口（§2.5）。
  err_intro: >-
    计数器 **RO**，饱和到全 1。**无读清、无 RW 写清**。写 `CNT_CLR` 对应位 1
    清零该计数；`CNT_CLR` 为 WO，写后读为 0（自清）。`PORT_RST` **不**清这些计数。
  err_appd: App. D PORT_CAP2 的 flit/LTB 错误计数切片（D.6.3）为规范镜像，不在本窗口重复抄字段。
  test_credit_hooks: >-
    信用钩子（`tb_inj_crd_cells` / `tb_obs_crd_*`）固定对 **VL0**。
    `tb_inj_crd_cells` 在 `tb_test_mode=1` 时每拍覆盖 cell 计数，HOOKS **不**增加存储寄存器。
  test_not_in_window: 不在本窗口提供：FSM 状态 force、叶子内部（CRC/FEC/deskew/缓冲）观察。见 SPEC §10.5。
  test_hooks0: "`TEST_HOOKS=0` 时本窗同样读 0 / 写忽略 / `csr_err=0`（与上条相同，不是未映射）。"
  appd_intro: >-
    相对 `0x1000` 的偏移 = 规范 PORT0 相对 `0x0002_0000` 的偏移。
    字段级位定义 **不在本仓库展开**；一行表示一个 32-bit 软件窗口或切片基址。
    生成器可按节号对照规范展开。
  appd_mix: "`MIX` = 切片内既有 RO 也有 RW/W1C，以对应节为准。`NA` 复位：对照该节，不在此抄。`APPD_LMSM_ST` 是 D.6.21 切片窗口，不是把 `STATUS.LMSM_ST` / `lmsm_st[4:0]` 重打包进 `0x1E00`。"
  appd_unimplemented: >-
    M1 不实现的 PORT_CAP 切片（DATA_RATE2–9、EYE_MONITOR、QDLWS 等）在 Bitmap 中报不存在。DATA_RATE1（D.6.5）是否只读反映 Data Rate 0：规范未规定 M1 镜像策略，见 SPEC §13（建议最小只读、不实现改速）。
  gen_intro: 头文件 / Python 模型应按 §2 表逐行生成：
  gen_rules:
    - 同一 `offset_hex` + `reg_name` 合成一个 32-bit 寄存器。
    - 字段拼进该字；未列的位为保留，读 0。
    - "`WINDOW` 行不生成字段，只生成基址常量与 `spec_ref` 注释，提示从官方 App. D 展开。"
    - "`TEST_*` 寄存器在 PRODUCT 网表绑定为无副作用（§2.4、SPEC §11）。"
  gen_access: 访问类型缩写供生成器使用，勿改拼写：`RW` `RO` `W1C` `WO` `MIX`。
  appd_migrate: >-
    App. D 窗口内地址迁徙（Q3）：`APPD_LMSM_ST` `0x2400`→`0x1E00`；
    `APPD_PORT_ERR` `0x2500`→`0x1F00`。两者落入 `0x1000`–`0x1FFF`，
    避开规范相对偏移上的 DATA_RATE 等切片。

generation:
  generated_banner: GENERATED — edit docs/regmap/regmap.yaml
  window_rows_do_not_expand_fields: true
  test_product_no_side_effects: true

registers:
  - name: CTRL
    offset: 0x0000
    window: CTRL_STATUS
    fields:
      - name: PORT_RST
        msb: 0
        lsb: 0
        access: WO
        reset: "0x0"
        self_clearing: true
        pulse_cycles: 16
        pulse_clock: core_clk
        pulse_output: port_rst_pulse
        reset_scope:
          includes: [PCS, LMSM, DLL, retry, credit]
          excludes: [CSR config, counters, IRQ, TEST]
        description: >-
          写 1 自清。产生 16 拍 `core_clk` 脉冲，复位 PCS/LMSM/DLL（含 retry）与信用计数。
          **不**复位 CSR 配置、计数、IRQ、TEST
        spec_ref: proj; SPEC §3.2.3
        notes:
          - self-clearing
          - 16-cycle core_clk pulse
      - name: LMSM_START
        msb: 1
        lsb: 1
        access: RW
        reset: "0x0"
        config_output: csr_lmsm_start
        description: 软件启动 LMSM 离开 Link_Idle（实现「上层指示」）
        spec_ref: proj; UB-PHY §3.4.3.1
      - name: IRQ_EN
        msb: 2
        lsb: 2
        access: RW
        reset: "0x0"
        config_output: csr_irq_en
        description: 顶层 `irq` 总使能
        spec_ref: proj
      - name: RSVD
        msb: 31
        lsb: 3
        access: RO
        reset: "0x0"
        description: 保留
        spec_ref: proj

  - name: STATUS
    offset: 0x0004
    window: CTRL_STATUS
    fields:
      - name: LINK_UP
        msb: 0
        lsb: 0
        access: RO
        reset: "0x0"
        source: hw
        hw_port: hw_link_up
        description: 与顶层 `link_up` 同
        spec_ref: proj; UB-PHY §3.4.3
      - name: LINK_READY
        msb: 1
        lsb: 1
        access: RO
        reset: "0x0"
        source: hw
        hw_port: hw_link_ready
        description: 与顶层 `link_ready` 同
        spec_ref: proj; UB-PHY §3.4.3.7
      - name: DLL_STATUS_UP
        msb: 2
        lsb: 2
        access: RO
        reset: "0x0"
        source: hw
        hw_port: hw_dll_status_up
        description: 可发 DLLDP
        spec_ref: proj; UB-DL §4.2
      - name: LMSM_ST
        msb: 7
        lsb: 3
        access: RO
        reset: "0x0"
        source: hw
        hw_port: hw_lmsm_st
        description: 同 `tb_obs_lmsm_st` 编码，见 SPEC §10.3
        spec_ref: proj; UB-PHY §3.4.3
      - name: DLL_SM_ST
        msb: 9
        lsb: 8
        access: RO
        reset: "0x0"
        source: hw
        hw_port: hw_dll_sm_st
        description: 同 `tb_obs_dll_sm_st` 编码，见 SPEC §10.3
        spec_ref: proj; UB-DL §4.2
      - name: RETRY_REQ_ST
        msb: 12
        lsb: 10
        access: RO
        reset: "0x0"
        source: hw
        hw_port: hw_retry_req_st
        description: 0=`NORMAL`，1=`REQ`，2=`WAIT`，3=`RETRAIN`，4=`ERROR`，5–7 保留。RTL 永不产出保留值；TB assert
        spec_ref: proj; UB-DL §4.7.3.3
        enums:
          - {value: 0, name: NORMAL}
          - {value: 1, name: REQ}
          - {value: 2, name: WAIT}
          - {value: 3, name: RETRAIN}
          - {value: 4, name: ERROR}
          - {value: 5, name: RSVD5, reserved: true}
          - {value: 6, name: RSVD6, reserved: true}
          - {value: 7, name: RSVD7, reserved: true}
        reserved_values: [5, 6, 7]
        rtl_never_produces_reserved: true
        tb_assert_reserved: true
      - name: RETRY_ACK_ST
        msb: 14
        lsb: 13
        access: RO
        reset: "0x0"
        source: hw
        hw_port: hw_retry_ack_st
        description: 0=`NORMAL`，1=`ACK`，2–3 保留。RTL 永不产出保留值；TB assert
        spec_ref: proj; UB-DL §4.7.3.4
        enums:
          - {value: 0, name: NORMAL}
          - {value: 1, name: ACK}
          - {value: 2, name: RSVD2, reserved: true}
          - {value: 3, name: RSVD3, reserved: true}
        reserved_values: [2, 3]
        rtl_never_produces_reserved: true
        tb_assert_reserved: true
      - name: RSVD
        msb: 31
        lsb: 15
        access: RO
        reset: "0x0"
        description: 保留
        spec_ref: proj

  - name: IRQ_STATUS
    offset: 0x0008
    window: CTRL_STATUS
    fields:
      - name: FEC_UNCORR
        msb: 0
        lsb: 0
        access: W1C
        reset: "0x0"
        event_port: ev_fec_uncorr
        description: FEC 不可纠正曾发生
        spec_ref: proj; UB-PHY §3.2.3.5
      - name: CRC_FAIL
        msb: 1
        lsb: 1
        access: W1C
        reset: "0x0"
        event_port: ev_crc_fail
        description: BCRC 失败曾发生
        spec_ref: proj; UB-DL §4.7.2
      - name: RETRY_ERR
        msb: 2
        lsb: 2
        access: W1C
        reset: "0x0"
        event_port: ev_retry_err
        description: 重传进 ERROR 或超过阈值
        spec_ref: proj; UB-DL §4.8.2
      - name: CRD_PROTO
        msb: 3
        lsb: 3
        access: W1C
        reset: "0x0"
        event_port: ev_crd_proto
        description: 信用协议类错误（溢出/归还超时）
        spec_ref: proj; UB-DL §4.8.1
      - name: TRAIN_FAIL
        msb: 4
        lsb: 4
        access: W1C
        reset: "0x0"
        event_port: ev_train_fail
        description: LMSM 回到 Link_Idle 且训练未成功
        spec_ref: proj; UB-PHY §3.4.3
      - name: BAD_VL
        msb: 5
        lsb: 5
        access: W1C
        reset: "0x0"
        event_port: ev_bad_vl
        description: 未使能 VL 的包曾被丢弃（粘滞）
        spec_ref: proj; SPEC §7
      - name: CRD_UF
        msb: 6
        lsb: 6
        access: W1C
        reset: "0x0"
        event_port: ev_crd_uf
        description: 信用下溢（计数减过 0）曾发生（粘滞）。RTL irq 源，不是 RTL assert
        spec_ref: proj; SPEC §7
      - name: RSVD
        msb: 31
        lsb: 7
        access: RO
        reset: "0x0"
        description: 保留
        spec_ref: proj

  - name: IRQ_MASK
    offset: 0x000C
    window: CTRL_STATUS
    fields:
      - name: MASK
        msb: 6
        lsb: 0
        access: RW
        reset: "0x7F"
        config_output: csr_irq_mask
        description: 对应 IRQ_STATUS[6:0]，1=屏蔽。复位 **全部屏蔽**
        spec_ref: proj
      - name: RSVD
        msb: 31
        lsb: 7
        access: RO
        reset: "0x0"
        description: 保留
        spec_ref: proj

  - name: PORT_CNA
    offset: 0x0010
    window: CTRL_STATUS
    fields:
      - name: CNA
        msb: 31
        lsb: 0
        access: RW
        reset: "0x0"
        config_output: csr_port_cna
        description: 本地 CNA。软件读/写；**无** `tb_*` 钩子
        spec_ref: proj; App. D.5.5

  - name: PARAM_PHY
    offset: 0x0100
    window: PARAM
    fields:
      - name: PHY_MODE
        msb: 1
        lsb: 0
        access: RO
        reset: "0x2"
        description: 1=Mode-1，2=Mode-2。M1=2
        spec_ref: proj; UB-PHY §3.1.2
        enums:
          - {value: 1, name: MODE_1}
          - {value: 2, name: MODE_2}
      - name: DATA_RATE
        msb: 5
        lsb: 2
        access: RO
        reset: "0x0"
        description: Data Rate 编号。M1=0（2.578125G NRZ）
        spec_ref: proj; UB-PHY §3.1.2
      - name: NUM_LANES_TX
        msb: 9
        lsb: 6
        access: RO
        reset_from: variant
        reset_key: NUM_LANES
        description: >-
          二进制 TX lane 数。合法 1/2/4/8，其余保留。RTL 永不产出保留值；TB assert。
          复位来自 `variants:`（本字段即能力字的 NUM_LANES，不在 PARAM_VARIANT 重复）
        spec_ref: proj; UB-PHY §3.1.1
        legal_values: [1, 2, 4, 8]
        reserved_values: [0, 3, 5, 6, 7, 9, 10, 11, 12, 13, 14, 15]
        rtl_never_produces_reserved: true
        tb_assert_reserved: true
      - name: NUM_LANES_RX
        msb: 13
        lsb: 10
        access: RO
        reset_from: variant
        reset_key: NUM_LANES
        description: >-
          二进制 RX lane 数。合法 1/2/4/8，其余保留。RTL 永不产出保留值；TB assert。
          复位来自 `variants:`，默认等于 TX
        spec_ref: proj
        legal_values: [1, 2, 4, 8]
        reserved_values: [0, 3, 5, 6, 7, 9, 10, 11, 12, 13, 14, 15]
        rtl_never_produces_reserved: true
        tb_assert_reserved: true
      - name: PMA_W
        msb: 21
        lsb: 14
        access: RO
        reset: "0x20"
        description: PMA–PCS 每 lane 位宽，M1=32
        spec_ref: proj
      - name: ALLOW_ASYM
        msb: 22
        lsb: 22
        access: RO
        reset: "0x0"
        description: 1=允许非对称。M1=0
        spec_ref: proj
      - name: RSVD
        msb: 31
        lsb: 23
        access: RO
        reset: "0x0"
        description: 保留
        spec_ref: proj

  - name: PARAM_FEC
    offset: 0x0104
    window: PARAM
    fields:
      - name: FEC_MODE
        msb: 2
        lsb: 0
        access: RO
        reset: "0x2"
        description: 与 LTB `fec_mode_ctrl` 同编码（§3.4.1.1）。复位 T=4
        spec_ref: proj; UB-PHY §3.2.2.1、§3.4.1.1
      - name: CODEC_NUM
        msb: 4
        lsb: 3
        access: RO
        reset: "0x1"
        description: FEC 交织路数。默认建议 1，**待定**
        spec_ref: proj; UB-PHY §3.2.2.3
      - name: RSVD
        msb: 31
        lsb: 5
        access: RO
        reset: "0x0"
        description: 保留
        spec_ref: proj


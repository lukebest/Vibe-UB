      - name: NUM_PHY_REINIT_TH
        msb: 31
        lsb: 24
        access: RO
        reset: "0x04"
        description: "**草案** 4"
        spec_ref: proj; UB-DL §4.7.3.3

  - name: PARAM_CRD
